[package]
name = "grxxt"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Brutalist Linux TTY greeter for greetd"
authors = ["sxndmxn"]
license = "MIT"
repository = "https://github.com/sxndmxn/grxxt"
homepage = "https://github.com/sxndmxn/grxxt"
readme = "README.md"
keywords = ["greetd", "greeter", "tui", "login"]
categories = ["command-line-utilities"]
include = [
    "/src/**",
    "/tests/**",
    "/assets/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/deny.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/SECURITY.md",
    "/install.sh",
    "/grxxt.toml",
    "/greetd-config.toml",
]

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
shell-words = "1.1"
chrono = "0.4"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
signal-hook = { version = "0.4.4", default-features = false }
zeroize = "1.9"
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = true
strip = true
# Unwinding preserves the terminal cleanup guard if a dependency panics.
panic = "unwind"

[lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
unreachable_patterns = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Restriction lints (cherry-picked)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
wildcard_enum_match_arm = "deny"
allow_attributes_without_reason = "deny"

# Can't control transitive dependencies
multiple_crate_versions = "allow"
